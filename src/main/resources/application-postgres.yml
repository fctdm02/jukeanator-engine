# src/main/resources/application-postgres.yml
#
# Activate with: --spring.profiles.active=postgres (or SPRING_PROFILES_ACTIVE=postgres)
# Same JPA-backed user repository as application-mysql.yml, pointed at Postgres instead -- proof
# that UserRepositoryJpaImpl needs no code changes to switch vendors, only this file. Requires a
# Postgres server reachable at DB_URL with the schema created by
# src/main/resources/db/migration/postgresql/V1__init_user_schema.sql (run automatically by
# Flyway on startup).

user:
  repository-type: jpa

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jukeanator}
    username: ${DB_USERNAME:jukeanator}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks the mapping matches
  # spring.flyway.locations (classpath:db/migration/{vendor}) is set in the base application.yml
  # and resolves to db/migration/postgresql once this datasource is active.
